version: '3.8'

services:
  quartz_dev:
    # 使用项目根目录下的 Dockerfile 进行构建
    build: 
      context: .
    image: akiyama-blog/quartz-dev:v1.0 
    container_name: akiyama-quartz-server
      # 可以指定使用哪个 Dockerfile，如果不指定则默认使用 Dockerfile
    
    # 容器端口 (8080) 映射到宿主机端口 (8080)
    # Quartz 的 --serve 默认使用 8080 端口
    ports:
      - "8080:8080"
      
    # 核心配置：实现热更新
    volumes:
      # 1. 代码同步：将宿主机（您本地）的整个项目目录挂载到容器内的工作目录 /usr/src/app
      # 您的 F:\project\Akiyama-blog 就会映射到容器内的 /usr/src/app
      - .:/usr/src/app
      
      # 2. Node.js 依赖保护（关键）：
      # 这使用了一个匿名数据卷来覆盖 /usr/src/app/node_modules。
      # 作用是：防止宿主机（Windows）的 node_modules 覆盖容器内（Linux）安装的依赖。
      # 这样容器将使用其在 build 阶段安装的、正确的 Linux 依赖。
      - /usr/src/app/node_modules
      
    # 覆盖 Dockerfile 中的 CMD，确保使用 --serve 命令进行开发
    # 您的 Dockerfile 已经使用了这个命令，但显式写在这里更清晰
    command: ["npx", "quartz", "build", "--serve"]
    
    # 确保容器崩溃时自动重启，方便开发
    restart: always